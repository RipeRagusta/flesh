<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width,initial-scale=1.0">
	<title>Flesh Enterprises</title>
	<link rel="stylesheet" href="./initialize.css">
	<link rel="shortcut icon" type="image" href="./Logo.png">
	<style>
		body{
			background-color: #ffffff;
		}

		main{
			display: flex;
  			justify-content: center;
  			align-items: center;
  			background-image: url("./thanyou.png");
  			background-size: 50vw auto;
  			background-repeat: repeat;
  			image-rendering: pixelated;
  			height: 100dvh;
  			animation: thanever 1.25s linear infinite,
    				   flash 5s ease-in-out infinite;
		}

		@keyframes thanever{
			from {
		    	background-position-y: 0%;
		 	}

		  	to {
		    	background-position-y: calc((32 / 339) * 50vw);
		  	}
		}

		@keyframes flash{
			0% {
			    background-color: #ffffff;
			    background-image: url("./thanyou.png");
			}

			24% {
			    background-color: #ffffff;
			    background-image: url("./thanyou.png");
			}

			25% {
			    background-color: #ffb6c1;
			    background-image: url("./thanyouyellow.png");
			}

			30% {
			    background-color: #ffb6c1;
			    background-image: url("./thanyouyellow.png");
			}

			31% {
			    background-color: #ffffff;
			    background-image: url("./thanyou.png");
			}

			74%{
				background-color: #ffffff;
				background-image: url("./thanyou.png");
			}

			75%{
				background-color: #ffff00;
				background-image: url("./thanyoupink.png");
			}

			80%{
				background-color: #ffff00;
				background-image: url("./thanyoupink.png");
			}
			81%{
				background-color: #ffffff;
				background-image: url("./thanyou.png");
			}

			100% {
		    	background-color: #ffffff;
		    	background-image: url("./thanyou.png");
			}
		}
	</style>
	<script src="./randomizer.js"></script>
</head>
<body onload="firstrandom(10)">
	<a id="reseter" href="./index.html" style="text-decoration: none;">
		<main>
			
		</main>
	</a>
</body>
</html>
